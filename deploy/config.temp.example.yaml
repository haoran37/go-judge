# temp 判题节点示例配置。
# temp 节点适合临时扩容或短期比赛。首次启动用 authCode 调用 POST /api/judge/temp-token 注册，
# 成功后节点把逐节点凭证原子写入 credential.tokenFile；之后只通过
# POST /judge/nodes/token/renew 续期（保持 nodeId/tokenId，不再兑换授权码）。

node:
  # 节点名称。临时节点也建议唯一，便于后端识别和赛后清理。
  name: judge-node-temp-01
  # temp 表示临时节点，依赖后端签发的临时授权码完成首次注册。
  type: temp
  # 最大并发判题数。以服务端核准额度为准，节点上报不能提高。
  maxConcurrency: 2
  supportedJudgeModes:
    - default

hnieoj:
  # HnieOJ 后端网关地址。本地联调可用回环 HTTP；远程必须 HTTPS。
  baseUrl: "https://oj.example.com"
  requestTimeout: "30s"
  credential:
    # 首次注册成功后节点会创建并原子写入该文件；重启时优先读取它，不会再次兑换授权码。
    # 该目录需要可写，以便续期后原子替换凭证。
    tokenFile: "/etc/hnieoj/judge-node/credential.json"
    token: ""
    # 临时授权码。仅在首次注册时使用，真实值不要提交到仓库。
    authCode: "replace_me"
  renew:
    # 临时节点续期不得超过后端首次授予的 authorizationUntil，超限会被后端拒绝。
    safetyMargin: "30s"
    retryBackoff: "10s"

testdata:
  cacheRoot: "/data/oj/judge-cache"
  maxCacheBytes: 21474836480
  maxUnusedDuration: "72h"
  cleanupInterval: "1h"
  statsInterval: "5m"

gojudge:
  endpoint: "http://go-judge-sandbox:5050"
  authToken: ""

reporter:
  mode: "http"
  endpoint: "/judge/submissions/{submissionId}/events"
  maxRetries: 3
  retryBackoff: "2s"

heartbeat:
  enabled: true
  endpoint: "/judge/nodes/heartbeat"
  interval: "30s"

worker:
  emptyMinBackoff: "200ms"
  emptyMaxBackoff: "5s"
  drainTimeout: "5m"
