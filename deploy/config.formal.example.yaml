# formal 判题节点示例配置。
# formal 节点由管理员通过 POST /api/admin/judge/nodes/formal-tokens 签发独立逐节点 Bearer 凭证，
# 运维将凭证 JSON 交付到 credential.tokenFile（推荐）或填入 credential.token。
# 不再依赖共享正式主密钥、RSA 私钥或 Nacos。

node:
  # 节点名称。建议在 HnieOJ 集群内唯一，便于心跳、日志和故障定位。
  name: judge-node-01
  # formal 表示正式长期节点；不要把临时节点授权码填到 formal 节点配置中。
  type: formal
  # 最大并发判题数。必须与管理员签发凭证时的 maxConcurrency 一致或更小，后端以核准额度为准。
  maxConcurrency: 2
  # 节点声明支持的判题模式。未完成后端、题目数据和节点联调前只保留 default。
  supportedJudgeModes:
    - default

hnieoj:
  # HnieOJ 后端网关地址。远程后端必须使用 HTTPS，节点不跳过证书校验。
  baseUrl: "https://oj.example.com"
  # 节点访问后端认证、测试数据、事件上报、心跳接口的 HTTP 超时。
  requestTimeout: "30s"
  credential:
    # 运维交付的逐节点运行凭证 JSON（由管理员签发接口返回的 token/nodeId/tokenId 等）。
    # 节点续期后会以 0600 权限原子替换该文件，重启优先读取最新续期凭证，因此该目录需可写。
    tokenFile: "/etc/hnieoj/judge-node/credential.json"
    # 也可直接内联逐节点 Bearer JWT，留空则只使用 tokenFile；不要提交真实凭证到仓库。
    token: ""
    # formal 节点不使用授权码。
    authCode: ""
  renew:
    # 依据后端 JWT exp（Unix 毫秒）提前续期；不依赖节点本地时区。
    # 若签发的 TTL 小于安全余量，节点按剩余有效期的一小部分及时续期，不会睡过新 exp。
    safetyMargin: "30s"
    retryBackoff: "10s"

testdata:
  # 测试数据缓存目录。部署脚本会挂载宿主机持久化目录到该路径。
  cacheRoot: "/data/oj/judge-cache"
  maxCacheBytes: 21474836480
  maxUnusedDuration: "72h"
  cleanupInterval: "1h"
  statsInterval: "5m"

gojudge:
  # go-judge sandbox 服务地址。本地/内网 HTTP 端点，与后端 HTTPS 要求无关。
  endpoint: "http://go-judge-sandbox:5050"
  authToken: ""

reporter:
  mode: "http"
  endpoint: "/judge/submissions/{submissionId}/events"
  maxRetries: 3
  retryBackoff: "2s"

heartbeat:
  enabled: true
  endpoint: "/judge/nodes/heartbeat"
  interval: "30s"

worker:
  emptyMinBackoff: "200ms"
  emptyMaxBackoff: "5s"
  drainTimeout: "5m"
